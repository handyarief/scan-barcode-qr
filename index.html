<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scan Barcode → QR Code</title>

  <!-- PWA & Mobile App Meta -->
  <meta name="theme-color" content="#0f62fe" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Scan2QR" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="./logo.png" />
  <link id="pwa-manifest" rel="manifest" href="" />
  <link rel="stylesheet" href="./style.css" />

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-group">
        <img src="./logo.png" alt="Logo Scan2QR" class="app-logo" />
        <div class="header-text">
          <h1>Scan Barcode → QR Code</h1>
          <p>Semua Barcode 1D/2D atau scanner fisik</p>
        </div>
      </div>
      <button id="install-btn" type="button" onclick="installApp()">Install App</button>
    </header>

    <!-- Area Kamera & Input Scanner Fisik -->
    <div class="card">
      <div id="scanner-viewport" class="scanner-viewport" title="Ketuk layar kamera untuk fokus ulang">
        <div id="reader"></div>
        <div class="scan-guide"></div>
      </div>

      <div id="zoom-box" class="zoom-control">
        <span>Zoom:</span>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" />
        <span id="zoom-value">1.0x</span>
      </div>

      <div class="camera-controls">
        <button id="flash-btn" type="button" onclick="toggleFlash()" disabled>
          <span id="flash-icon">⚡</span>
          <span id="flash-label">Flash: Mati</span>
        </button>
      </div>
      <div id="flash-status">Menyiapkan kamera &amp; lampu flash...</div>

      <div class="manual-input">
        <input
          type="text"
          id="scanner-input"
          placeholder="Ketik / tembak scanner fisik..."
          autocomplete="off"
        />
        <button type="button" onclick="handleManualSubmit()">Buat QR</button>
      </div>
    </div>

    <!-- Area Hasil QR Code -->
    <div class="card result-area">
      <span id="status-badge" class="badge">Menunggu Scan...</span>
      <div id="format-info">Format: -</div>
      <div id="decoded-text">-</div>
      <div id="qrcode-wrapper">
        <span style="color:#8d8d8d; font-size:0.85rem;">QR Code akan muncul di sini</span>
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="copyText()">Salin Teks</button>
        <button type="button" class="secondary" onclick="downloadQR()">Simpan QR</button>
        <button type="button" onclick="resetScan()">Scan Baru</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
