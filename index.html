<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scan Barcode → QR Code</title>

  <!-- PWA & Mobile App Meta -->
  <meta name="theme-color" content="#0f62fe" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Scan2QR" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="./logo.png" />
  <link id="pwa-manifest" rel="manifest" href="" />
  <link rel="stylesheet" href="./style.css" />

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-group">
        <img src="./logo.png" alt="Logo Scan2QR" class="app-logo" />
        <div class="header-text">
          <h1>Scan Barcode → QR Code</h1>
          <p>Semua Barcode 1D/2D atau scanner fisik</p>
        </div>
      </div>
      <button id="install-btn" type="button" onclick="installApp()">Install App</button>
    </header>

    <!-- Area Kamera & Kontrol Pemindai -->
    <div class="card scanner-card">
      <div id="scanner-viewport" class="scanner-viewport mode-full" title="Ketuk layar kamera untuk fokus ulang">
        <div id="reader"></div>

        <!-- Bar Atas: 3 Mode Scan (Full, Square, Bar) -->
        <div class="scan-top-overlay">
          <div class="scan-mode-tabs" role="tablist" aria-label="Mode Area Scan">
            <button type="button" class="mode-tab active" data-mode="full" onclick="setScanMode('full')">Full</button>
            <button type="button" class="mode-tab" data-mode="square" onclick="setScanMode('square')">Square</button>
            <button type="button" class="mode-tab" data-mode="bar" onclick="setScanMode('bar')">Bar</button>
          </div>
          <div id="scan-instruction" class="scan-instruction"></div>
        </div>

        <!-- Panduan Visual Area Scan -->
        <div id="scan-guide" class="scan-guide">
          <span class="guide-corner corner-tl"></span>
          <span class="guide-corner corner-tr"></span>
          <span class="guide-corner corner-bl"></span>
          <span class="guide-corner corner-br"></span>
        </div>

        <!-- Bar Bawah: Ikon Lama Tetap Sama + 1 Tombol Jepret Foto Bulat -->
        <div class="scan-bottom-controls">
          <button
            id="flash-btn"
            type="button"
            class="icon-circle-btn"
            onclick="toggleFlash()"
            disabled
            aria-label="Lampu Flash"
            title="Lampu Flash"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 2h10v3l-2 3v12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8L7 5V2zm5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
            </svg>
          </button>

          <button
            id="zoom-toggle-btn"
            type="button"
            class="icon-circle-btn"
            onclick="toggleZoomPanel()"
            aria-label="Pengaturan Zoom"
            title="Zoom Kamera"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>

          <button
            id="photo-shutter-btn"
            type="button"
            class="photo-shutter-circle-btn"
            onclick="triggerPhotoCapture()"
            aria-label="Ambil Foto Angka atau Huruf"
            title="Ambil Foto untuk Salin Angka/Huruf"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>

          <button
            id="keyboard-toggle-btn"
            type="button"
            class="icon-circle-btn"
            onclick="toggleManualPanel()"
            aria-label="Ketik Manual"
            title="Ketik Manual / Scanner Fisik"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm1 3v2h2V8H5zm3 0v2h2V8H8zm3 0v2h2V8h-2zm3 0v2h2V8h-2zm3 0v2h2V8h-2zM5 11v2h2v-2H5zm3 0v2h2v-2H8zm3 0v2h2v-2h-2zm3 0v2h2v-2h-2zm3 0v2h2v-2h-2zM7 14v2h10v-2H7z"/>
            </svg>
          </button>
        </div>

        <input
          type="file"
          id="photo-capture-input"
          accept="image/*"
          capture="environment"
          style="display: none;"
        />
      </div>

      <!-- Panel Slider Zoom (Muncul saat ikon Zoom ditekan) -->
      <div id="zoom-box" class="zoom-control">
        <span>Zoom:</span>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" />
        <span id="zoom-value">1.0x</span>
        <button type="button" id="auto-zoom-btn" class="mini-pill-btn active" onclick="toggleAutoZoom()">Auto</button>
      </div>

      <div id="flash-status">Menyiapkan kamera &amp; lampu flash...</div>

      <!-- Panel Input Manual / Scanner Fisik (Muncul saat ikon Keyboard ditekan atau saat scanner fisik mengetik) -->
      <div id="manual-panel" class="manual-input">
        <input
          type="text"
          id="scanner-input"
          placeholder="Ketik manual atau tembak scanner fisik..."
          autocomplete="off"
        />
        <button type="button" onclick="handleManualSubmit()">Buat QR</button>
      </div>

      <!-- Panel Cepat Ambil Foto -> Pilih / Copy Angka atau Huruf -> Paste ke Manual -->
      <div id="photo-lens-panel" class="photo-lens-panel" aria-live="polite">
        <div class="photo-lens-header">
          <span class="photo-lens-title">Lens Angka &amp; Huruf</span>
          <div class="photo-lens-header-actions">
            <button type="button" class="photo-lens-rephoto" onclick="retakePhotoOnly()">Foto Ulang</button>
            <button type="button" class="photo-lens-close" onclick="closePhotoLensPanel()">Tutup</button>
          </div>
        </div>
        <div class="photo-lens-body">
          <img id="captured-photo-preview" class="captured-photo-preview" alt="Hasil foto kode" />
          <div class="photo-lens-controls">
            <div id="photo-ocr-status" class="photo-ocr-status">Ambil foto atau pilih teks angka/huruf untuk disalin cepat</div>
            <input
              type="text"
              id="photo-extracted-text"
              class="photo-text-input"
              placeholder="Hasil deteksi angka atau huruf (bisa diketik/diedit)..."
              oninput="buildPhotoTokens()"
            />
            <div id="photo-token-list" class="photo-token-list"></div>
            <div class="photo-lens-actions">
              <button type="button" class="secondary" onclick="copyPhotoText()">Salin</button>
              <button type="button" onclick="pastePhotoTextToManual()">Paste ke Manual</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet Hasil Scan (Muncul dari bawah saat tertangkap scan) -->
  <div id="scan-sheet-backdrop" class="sheet-backdrop" onclick="dismissScanSheet()"></div>
  <section id="scan-result-sheet" class="scan-result-sheet" aria-live="polite">
    <div id="sheet-drag-handle" class="sheet-drag-area" title="Swipe ke bawah atau ketuk panah untuk menutup">
      <button type="button" id="sheet-dismiss-btn" class="sheet-arrow-btn" onclick="dismissScanSheet()" aria-label="Tutup hasil scan">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
    </div>

    <div class="sheet-header-row">
      <span id="sheet-scanned-count" class="sheet-count-title">Scanned</span>
      <button type="button" id="completed-btn" class="completed-btn" onclick="completeScan()">Completed</button>
    </div>

    <div class="sheet-detail-card">
      <div class="sheet-detail-row">
        <span class="sheet-label">Barcode:</span>
        <span id="sheet-barcode-value" class="sheet-value">-</span>
      </div>
      <div class="sheet-detail-row">
        <span class="sheet-label">Format:</span>
        <span id="sheet-format-value" class="sheet-value">-</span>
      </div>
      <div class="sheet-detail-row sheet-copy-row">
        <button type="button" id="sheet-copy-btn" class="sheet-copy-btn" onclick="copyText()">Salin Teks</button>
        <span id="status-badge" class="badge">Menunggu Scan...</span>
      </div>
    </div>
  </section>

  <!-- Tampilan Kode QR Kotak Full Screen (Muncul dari bawah setelah klik Completed) -->
  <section id="fullscreen-qr-modal" class="fullscreen-qr-modal" aria-hidden="true">
    <div class="fullscreen-qr-header">
      <div>
        <h2>Kode QR Hasil Scan</h2>
        <div id="format-info">Format: -</div>
      </div>
      <button type="button" class="close-fullscreen-btn" onclick="resetScan()" aria-label="Tutup Full Screen">✕</button>
    </div>

    <div class="fullscreen-qr-body">
      <div id="qrcode-wrapper" class="fullscreen-qr-box">
        <span style="color:#8d8d8d; font-size:0.85rem;">QR Code akan muncul di sini</span>
      </div>
      <div id="decoded-text">-</div>
    </div>

    <div class="actions fullscreen-actions">
      <button type="button" class="secondary" onclick="copyText()">Salin Teks</button>
      <button type="button" class="secondary" onclick="downloadQR()">Simpan QR</button>
      <button type="button" onclick="resetScan()">Scan Baru</button>
    </div>
  </section>

  <script src="./script.js"></script>
</body>
</html>
